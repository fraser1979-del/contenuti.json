name: Automazione Post Libro

on:
  schedule:
    - cron: '0 9 * * 1,4' # Esegue ogni lunedì e giovedì alle 9:00 AM
  workflow_dispatch: # Permette di avviarlo anche manualmente per test

jobs:
  run-poster:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Poster Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python poster.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add contenuti.json
          git commit -m "Auto-update stato post [skip ci]" || exit 0
          git push
